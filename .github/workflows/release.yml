name: Release

# Publishes a GitHub Release (tag vX.Y.Z + zipped universal app) whenever the version in Info.plist
# is bumped on main. If that version already has a release, nothing happens.
on:
  push:
    branches: [main]
    paths:
      - Info.plist
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Read version and check for an existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Info.plist)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION already exists, nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build universal app
        if: steps.version.outputs.exists == 'false'
        run: ./build.sh

      - name: Create release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "build/CleanPaste-$VERSION.zip" \
            --target "$GITHUB_SHA" \
            --title "CleanPaste $VERSION" \
            --generate-notes
