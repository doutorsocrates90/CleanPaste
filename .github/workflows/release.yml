name: Release

# Push a tag such as v1.1.0 and a GitHub Release with the zipped app is created automatically.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: ./build.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/CleanPaste-*.zip \
            --title "CleanPaste ${GITHUB_REF_NAME#v}" \
            --generate-notes
